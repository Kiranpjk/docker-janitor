[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-janitor"
version = "0.1.0"
description = "Safe, dry-run-first cleanup of old Docker containers, images and orphaned volumes"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jaya Kiran" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
docker-janitor = "docker_janitor.cli:main"

[tool.setuptools]
packages = ["docker_janitor"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
